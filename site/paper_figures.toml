zh = "滑动窗口注意力：每个 token 最多看前一层的 W 个 token（图中 W = 3）。窗口外的 token 仍会影响预测：每过一层，信息最多往前传 W 个 token，k 层之后最多 k × W 个。"
en = "Sliding window attention: each token attends to at most W tokens of the previous layer (W = 3 here). Tokens outside the window still matter: each layer moves information forward by up to W tokens, so k layers reach up to k × W."

