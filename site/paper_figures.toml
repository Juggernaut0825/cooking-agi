en = "Pseudo-simulation. Top: from one real observation (a), a driving-specific 3DGS variant pre-generates synthetic start states (b, c, d) before evaluation rather than online. Bottom: two-stage scoring; stage 1 scores the plan for (a), stage 2 scores the plans from the synthetic starts, each weighted by how close its start is to the stage-1 endpoint."

