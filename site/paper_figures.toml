[[figure]]
id = "flashattention-tiling"
paper = "FlashAttention"
credit = "Dao et al., 2022"
arxiv = "2205.14135"
figure = 1
url = "https://arxiv.org/html/2205.14135v2#S1.F1"
license = "arXiv non-exclusive license"
license_url = "http://arxiv.org/licenses/nonexclusive-distrib/1.0/"
zh = "FlashAttention 用分块计算，不在较慢的 GPU HBM 上写出完整的 N×N 注意力矩阵：外层循环把 K、V 分块读进片上 SRAM，内层循环处理 Q 的分块，再把结果写回 HBM。"
en = "FlashAttention tiles the computation so the full N×N attention matrix never lands in slower GPU HBM: the outer loop loads blocks of K and V into on-chip SRAM, the inner loop processes blocks of Q, and outputs are written back to HBM."

