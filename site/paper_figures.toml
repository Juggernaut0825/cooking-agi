zh = "DreamerV3 的训练过程。(a) 世界模型把观测编码成离散表示 z，由带循环状态 h 的序列模型在给定动作下预测，并重建输入来塑造表示；(b) actor 和 critic 只在世界模型想象出的表示轨迹上学习。"
en = "DreamerV3's training process. (a) The world model encodes observations into discrete representations z, which a sequence model with recurrent state h predicts from actions, and reconstructs the inputs to shape them. (b) The actor and critic learn only from trajectories of these representations imagined by the world model."

[[figure]]
id = "dreamer4-world-model"
paper = "Dreamer 4"
credit = "Hafner et al., 2025"
