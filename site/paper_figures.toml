# Figures from papers, placed in notes with <!-- paper-figure:ID -->.
#
# Every entry names the paper, the figure and its licence. An entry with `image` is
# embedded: allowed only for CC BY 4.0 / CC BY-SA 4.0 / CC0 papers (checked by
# site/tests/test_paper_figures.py), rendered with the credit, licence link and our
# changes. Without `image` the note gets a link card that opens the figure in the
# paper: use it for arXiv-licensed and NC papers, and when the paper ships no image.
# These figures are third-party material: they keep their own licence, not the
# repository's CC BY 4.0 (see LICENSE.md).
#
# Images live in site/static/paper-figures/, downloaded from the paper's arXiv HTML
# version; `changes` says what we did to them ("resized" or "converted").

