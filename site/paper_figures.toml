width = 1370
height = 425
changes = "converted"
zh = "BLIP 的 CapFilt：用 Captioner（Cap）给网页图片生成合成描述，再用 Filter（Filt）去掉有噪声的描述。"
en = "BLIP's CapFilt: a Captioner (Cap) writes synthetic captions for web images, and a Filter (Filt) removes noisy captions."

[[figure]]
id = "blip2-stage2"
paper = "BLIP-2"
credit = "Li et al., 2023"
arxiv = "2301.12597"
figure = 3
url = "https://arxiv.org/html/2301.12597v3#S3.F3"
license = "CC BY 4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
