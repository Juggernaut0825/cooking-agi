en = "Parallel sampling versus sequential revisions. Left: parallel sampling generates N answers independently, while sequential revision conditions each attempt on the earlier ones. Right: either way a verifier can pick the best, and the budget can be split across several sequential chains, choosing within each chain and then across chains."

