zh = "DPO 不用强化学习就能优化人类偏好：已有方法先在偏好对上拟合奖励模型，再用 RL 找让奖励最大的策略；DPO 用一个简单的分类目标直接优化策略，它隐含的奖励模型对应的最优策略可以闭式求出。"
en = "DPO optimizes for human preferences without reinforcement learning: existing methods first fit a reward model to preference pairs and then use RL to maximize it; DPO directly optimizes the policy with a simple classification objective, fitting an implicit reward model whose optimal policy has a closed form."

