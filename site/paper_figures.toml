[[figure]]
id = "qwen3omni-overview"
paper = "Qwen3-Omni"
credit = "Qwen Team, 2025"
arxiv = "2509.17765"
figure = 2
url = "https://arxiv.org/html/2509.17765v1#S2.F2"
license = "CC BY 4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
image = "2509.17765-fig2.webp"
width = 1600
height = 1691
changes = "resized"
zh = "Qwen3-Omni 总览：Thinker–Talker 结构。Thinker 负责生成文字；Talker 直接接收 Thinker 的高层表示，生成流式语音 token。为了低延迟，Talker 自回归地预测多码本序列：每一步由 MTP 模块给出当前帧的残差码本，再由 Code2Wav 逐帧合成波形。"
en = "Qwen3-Omni overview: the Thinker–Talker architecture. Thinker generates text; Talker receives Thinker's high-level representations directly and generates streaming speech tokens. For low latency, Talker autoregressively predicts a multi-codebook sequence: at each step an MTP module outputs the current frame's residual codebooks, and Code2Wav synthesizes the waveform frame by frame."

