zh = "Genie 的潜在动作模型（LAM）：编码器看过去的帧和下一帧，给出一个量化后的潜在动作；解码器只看过去的帧和这个动作，必须重建下一帧，于是动作代码被迫说明“变了什么”。全程不需要动作标签。"
en = "Genie's latent action model: the encoder sees past frames and the next frame and outputs a quantised latent action; the decoder sees only the past frames and that action and must reconstruct the next frame, so the code is forced to describe what changed. No action labels are needed."

