en = "Grouped-query attention: multi-head attention has H query, key and value heads; multi-query attention shares one key/value head across all query heads; GQA shares one key/value head per group of query heads, in between the two."

[[figure]]
id = "streamingllm-windows"
paper = "StreamingLLM"
credit = "Xiao et al., 2023"
arxiv = "2309.17453"
figure = 1
url = "https://arxiv.org/html/2309.17453v4#S1.F1"
license = "CC BY 4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
image = "2309.17453-fig1.webp"
width = 1324
height = 440
changes = "converted"
zh = "StreamingLLM 和已有做法对比：(a) 全量注意力，缓存越来越大，超出预训练长度后效果下降；(b) 只缓存最近 L 个 token 的窗口注意力，开头 token 的 KV 被挤掉后效果骤降；(c) 每步用最近 L 个 token 重算的滑动窗口，效果好但很慢；(d) StreamingLLM 保留开头几个 token（attention sink）再加最近的 token，又快又稳。"
en = "StreamingLLM versus existing methods: (a) dense attention, whose cache keeps growing and which degrades past the pre-training length; (b) window attention over the most recent L tokens, which collapses once the first tokens' keys and values are evicted; (c) a sliding window with re-computation, which works but is slow; (d) StreamingLLM keeps a few initial tokens (the attention sink) plus recent ones, efficient and stable."

[[figure]]
