width = 1600
height = 483
changes = "resized"
zh = "第二阶段：借冻结的 LLM 自举生成能力。上：接 decoder-only 的 LLM（如 OPT）；下：接 encoder-decoder 的 LLM（如 FlanT5）。全连接层把 Q-Former 的输出维度对齐到 LLM 的输入维度。"
en = "Second stage: bootstrapping generation from a frozen LLM. Top: a decoder-based LLM (e.g. OPT). Bottom: an encoder–decoder LLM (e.g. FlanT5). A fully connected layer maps Q-Former's output dimension to the LLM's input dimension."

[[figure]]
id = "blip2-qformer"
paper = "BLIP-2"
credit = "Li et al., 2023"
arxiv = "2301.12597"
figure = 2
url = "https://arxiv.org/html/2301.12597v3#S3.F2"
license = "CC BY 4.0"
license_url = "https://creativecommons.org/licenses/by/4.0/"
image = "2301.12597-fig2.webp"
width = 1600
height = 330
changes = "resized"
zh = "左：Q-Former 的结构，以及第一阶段联合优化的三个目标，让一组可学习的 query 取出与文本最相关的视觉表示；右：每个目标各自的 self-attention mask。"
en = "Left: Q-Former's architecture and the three first-stage objectives optimized jointly, which push a set of learnable queries to extract the visual representation most relevant to the text. Right: each objective's self-attention mask."

