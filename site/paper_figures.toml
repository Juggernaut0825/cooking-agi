zh = "BERT 的预训练和微调流程：除了输出层，两个阶段用同一套结构；不同下游任务都从同一组预训练参数开始，微调时所有参数都会更新。"
en = "BERT's pre-training and fine-tuning: apart from the output layers both use the same architecture; every downstream task starts from the same pre-trained parameters, and fine-tuning updates all of them."

