zh = "V-JEPA 2-AC 的两项训练损失。左：teacher forcing，预测器每一步拿当前帧的真实表示，预测下一步的表示；右：rollout，把预测器自己的输出喂回去、往前多预测几步，减少滚动时的误差累积。"
en = "V-JEPA 2-AC's two training losses. Left: teacher forcing, where the predictor takes the real representation of the current frame and predicts the next one. Right: rollout, where the predictor's own outputs are fed back so it learns to predict several steps ahead with less error accumulation."

