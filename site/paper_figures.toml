zh = "Dreamer 4 的世界模型设计：因果 tokenizer 把图像块压成低维 latent；交互式 dynamics transformer 在动作、噪声水平、步长和 latent 交错排列的序列上，用 shortcut forcing 去噪。预训练后插入任务 token，从中预测动作、奖励和价值。"
en = "Dreamer 4's world model: a causal tokenizer squeezes image patches into low-dimensional latents, and an interactive dynamics transformer denoises them with shortcut forcing over an interleaved sequence of actions, noise levels, step sizes and latents. After pretraining, inserted task tokens predict actions, rewards and values."

[[figure]]
