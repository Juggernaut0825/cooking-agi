zh = "用 V-JEPA 2-AC 规划：在固定步数内用交叉熵方法（CEM）搜索动作序列，让想象出的未来表示和目标图片表示之间的 L1 距离最小；每轮用最好的一批动作更新高斯的均值和方差，最后返回均值。"
en = "Planning with V-JEPA 2-AC: the cross-entropy method searches for an action sequence over a fixed horizon that minimises the L1 distance between the imagined future representation and the goal image's representation, refitting Gaussian means and variances to the best samples each round and returning the mean."

[[figure]]
