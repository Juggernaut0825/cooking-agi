zh = "ACT 怎样执行动作：一次预测一整块动作（action chunking），而且每一步都查询策略，把重叠的几个块在同一时刻的预测加权平均（temporal ensembling），不再“看一步、做一步”地交替。"
en = "How ACT executes actions: it predicts a whole chunk of actions at a time and, querying the policy every step, averages the overlapping chunks' predictions for the same timestep (temporal ensembling), instead of alternating one observation with one action."

