zh = "PDM 的结构：PDM-Closed 先选中心线、预测周围环境，生成速度和横向偏移各不相同的候选轨迹，逐条仿真、打分后选一条；PDM-Hybrid 再加一个学习模块，只修正远期航点，限制学习部分在闭环里的影响。"
en = "PDM's architecture: PDM-Closed selects a centerline, forecasts the environment, creates trajectory proposals with different speeds and lateral offsets, and simulates and scores them to pick one; PDM-Hybrid adds a learned module that corrects only long-term waypoints, limiting the learned model's influence in closed loop."

