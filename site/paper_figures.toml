zh = "Push-T 上的多峰行为：在同一个状态下，末端可以从左边或右边推块。Diffusion Policy 两种都学到了，每次 rollout 只走一种；LSTM-GMM 和 IBC 偏向其中一种，BET 缺少动作的时间一致性，在两种之间摇摆。（v1 的编号；后续版本里是图 3。）"
en = "Multimodal behaviour on Push-T: from the same state the end effector can push the block from the left or the right. Diffusion Policy learns both and commits to one per rollout; LSTM-GMM and IBC are biased toward one mode, and BET, lacking temporal action consistency, fails to commit. (v1 numbering; Fig. 3 in later versions.)"

[[figure]]
